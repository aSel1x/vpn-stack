# The only place the Flutter client builds.
#
# app/README.md says building happens in CI rather than on a developer's
# machine, and it is not a preference: iOS and macOS artifacts can only be
# produced on a macOS runner, and the runners are free because this repository
# is public. One workflow, five artifacts, no local toolchain required.
#
# It keeps the four properties ci.yml has, for the same reasons ci.yml states:
# no `secrets:`, no deploy step of any kind, every `uses:` pinned, and
# `permissions: contents: read` written out rather than inherited from a
# settings page this file cannot document.
#
# PINNED MEANS PINNED TO A COMMIT SHA, with the tag in a trailing comment. It
# used to say "every action pinned" while every one of them named a major tag,
# which is a mutable pointer: `@v4` is whatever its owner last moved it to, and
# for the third-party `subosito/flutter-action` that owner is not GitHub. A
# workflow that builds the VPN clients this project hands to humans, on a
# runner with a checkout of this tree, is not a place to accept "whatever is
# there today". The cost is that a SHA cannot tell you it is stale, so
# .github/dependabot.yml watches github-actions and opens the bumps as
# reviewable pull requests.
#
# THE MAJORS MOVED AT THE SAME TIME, and not for tidiness: every run used to
# print "Node.js 20 is deprecated... being forced to run on Node.js 24" for
# checkout, upload-artifact, download-artifact and cache, plus "setup-java v4 is
# deprecated". A SHA pin makes that permanent rather than merely noisy -- a major
# tag would at least have drifted onto a supported runtime eventually, and a SHA
# never does -- so the migration had to land in the same change as the pinning.
# The majors are NOT all the same number and were each read off that action's own
# releases: checkout v5, cache v5, setup-java v5, setup-go v6, upload-artifact
# v6, download-artifact v7, setup-uv v7. `runs.using` was confirmed to be
# `node24` at each tag pinned below. subosito/flutter-action is exempt because it
# is a `composite` action -- it has no JavaScript runtime to deprecate.
#
# Each is the FIRST major on node24, deliberately, and not the newest one
# published: the newest are further along (checkout v7, download-artifact v8),
# and a major bump is an interface change, not a runtime change. Taking the
# smallest step that clears the deprecation keeps this change reviewable as one
# thing, and Dependabot proposes the rest as pull requests a human reads -- which
# is the arrangement, not a gap in it.
#
# The jobs, because the list here drifted from the file once already:
# `check` (analyzer, both Dart test suites, and the cheap iOS identifier
# assertions), `libbox` and `libbox_apple` (sing-box built from source for
# Android and for Apple), the five platform builds `android`, `ios`, `macos`,
# `windows`, `linux`, plus `ios_state` and `ios_project`, which between them
# regenerate app/ios/ when it is absent, and `ios_result`, which fails when
# neither of those two did anything.
#
# NOTHING HERE IS SIGNED, and that is the intended end state, not a TODO.
# The .ipa is built with --no-codesign and installs on no device until somebody
# with an Apple organization membership signs it (App Store Review Guideline
# 5.4 gates VPN apps on that, and a free Apple ID has no Network Extension
# entitlement at all -- app/README.md has the detail). The macOS .app and the
# Windows .exe are unsigned too: Gatekeeper will refuse the first launch until
# it is opened through the context menu, and SmartScreen will warn. The APK is
# signed with Flutter's debug key, which is what the generated Gradle template
# falls back to and is not a distribution identity either. Do not add signing
# steps, and do not add placeholder secrets for signing -- an empty secret that
# a step reads is how a workflow starts silently producing unsigned output
# while claiming otherwise.
#
# It does not run on every push. The server-side checks in ci.yml already do,
# and burning a macOS runner because somebody fixed a typo in README.md is
# rude. Pull requests are not a separate trigger here for the same reason:
# there is one operator, branches arrive as pushes, and a PR would otherwise
# build everything twice.
#
# THE PATH FILTER GOVERNS ARTIFACTS, NOT THE CONTRACT CHECK. `app/**` is the
# right filter for "should we spend two macOS runners", and the wrong one for
# "did anybody break app<->vpnctl --json": renaming a key in vpnctl/cli.py
# touches no file under app/, so for as long as this filter was the only
# trigger, the one test suite that exists to catch that never ran against the
# side that breaks it. The fix is not to add `vpnctl/**` here -- that rebuilds
# five artifacts for a server-side commit. `flutter analyze` and `flutter test`
# are duplicated in ci.yml's `dart` job, which has no path filter at all.
# The `check` job below stays, because GitHub has no cross-workflow `needs:`
# and something has to gate the five builds; the cost is one cheap ubuntu job
# running twice on an `app/**` push. Read app/README.md before trusting what
# that job proves: it catches a payload the Dart parser cannot read, NOT a
# renamed key, because the fixtures are hand-copied from cli.py.

name: app

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
      # compose.yml pins the sing-box the SERVER runs, and the libbox job builds
      # the client library from that same version. Without this line, bumping the
      # server's engine leaves the client linked against the old one and nothing
      # rebuilds -- the drift is invisible until a config parses on one side and
      # not the other.
      - 'compose.yml'

# NO `workflow_dispatch:`, and its absence is the fix rather than an omission.
# There was one here, carrying a `regenerate_ios_project` boolean, and the route
# it described could not be walked: GitHub offers "Run workflow" only for a
# workflow present on the repository's DEFAULT branch, and this file exists on
# `app` while the default branch is `main` and carries ci.yml alone. So the
# input was unreachable, the `if:` half that read it could never be true, and
# the error message that told a human to use it sent them looking for a button
# that is not rendered. An input that does nothing is worse than no input: it
# reads as a supported route.
#
# THE ROUTE THAT WORKS: delete app/ios/ and push. The `ios_state` job below
# reports it absent, `ios_project` regenerates it and uploads the ios-project
# artifact, and `ios` stands down for that run. Commit the artifact and the next
# push builds it again. That is one gesture, in git, on any branch.

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned exactly, for the reason ci.yml pins ruff: an unpinned toolchain hands
  # the next Flutter release a veto over every branch at once, and turns
  # somebody else's release into your red build. 3.47.4 stable ships Dart
  # 3.13.3, which is the constraint app/pubspec.yaml declares. Bump both in the
  # same commit or the SDK constraint and the toolchain drift apart.
  FLUTTER_VERSION: "3.47.4"

defaults:
  run:
    working-directory: app

jobs:
  # Everything else `needs:` this. A missing semicolon should cost one cheap
  # ubuntu runner, not five runners including two macOS ones.
  check:
    name: analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # BOTH CHECKS BELOW RUN BEFORE THE TOOLCHAIN, deliberately. Neither needs
      # Flutter, Ruby gems or Xcode -- one is `ruby -c`, the other is awk and
      # grep -- and installing Flutter first means a mismatch that is legible in
      # two seconds is reported four minutes in. The Android and iOS jobs order
      # their own assertions the same way and say so: a wrong artifact name is
      # cheaper to discover ahead of an SDK download than behind one.

      # The only cheap judge of tool/ios_project.rb. That script runs on a macOS
      # runner against a project that exists for the length of one job, so a
      # typo in it costs a 45-minute round trip to discover; ubuntu-latest ships
      # a Ruby and `-c` is a parse. It proves syntax and nothing else -- nothing
      # outside a macOS runner has the xcodeproj gem, so an API that moved is
      # still only visible in the ios_project job.
      - name: ruby -c tool/ios_project.rb
        run: ruby -c tool/ios_project.rb

      # The cheapest available substitute for a device, which is why it runs
      # here and not only behind a 45-minute macOS build. Every identifier the
      # packet-tunnel extension depends on -- the App Group, both bundle
      # identifiers, the two entitlement keys, the extension point -- is
      # compared at RUNTIME by iOS and by nothing at build time, so a mismatch
      # among tool/ios_identifiers.sh, app/ios/*/Info.plist, the two
      # entitlements files and Runner.xcodeproj compiles, links, wraps into a
      # valid .ipa, and then denies the sandbox on the first connect. On a
      # target no device has ever run, that symptom is unreachable. The script
      # reads the strings with awk and grep, so ubuntu-latest is enough.
      #
      # Guarded on the project being present rather than asserting it, and the
      # reason is the regeneration route above: deleting app/ios/ and pushing is
      # how a human asks for a new project, `ios_project` needs this job, and a
      # hard failure here would therefore refuse to regenerate the very
      # directory whose absence caused the failure. The skip is announced on
      # stdout and `ios_result` is what makes sure the run did not silently do
      # neither.
      - name: Check the iOS identifiers agree (tool/ios_identifiers.sh)
        run: |
          set -euo pipefail
          if [ -f ios/Runner.xcodeproj/project.pbxproj ]; then
            bash tool/check_extension.sh sources
          else
            echo "app/ios/ is absent, so there is nothing to assert against"
            echo "tool/ios_identifiers.sh yet -- the ios_project job will generate it"
            echo "and run the same check over what it wrote."
          fi

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # --enforce-lockfile, or the committed app/pubspec.lock is a freeze by
      # convention only: a plain `flutter pub get` resolves whatever satisfies
      # pubspec.yaml today, rewrites pubspec.lock with the new answer, and says
      # nothing at all. With the flag, pub exits 65 ("Unable to satisfy
      # `pubspec.yaml` using `pubspec.lock`") when the resolution would differ,
      # and exits 1 when the lockfile is missing entirely -- so a silent
      # re-resolution becomes the red build the lock was committed for by
      # "Commit pubspec.lock, because an untouched tree went red on somebody
      # else's release".
      #
      # This is also why there is no longer a step uploading the resolved
      # pubspec.lock as an artifact. That step existed to hand a human the
      # resolver's answer back when none was committed, and was then kept to
      # show "the resolution CI actually used" -- which under this flag cannot
      # differ from the committed file by construction, so the artifact was a
      # copy of a tracked file. The flag asserts what the upload only displayed.
      - name: flutter pub get
        run: flutter pub get --enforce-lockfile

      # `flutter analyze`, not `dart analyze`, and nothing is passed to it,
      # because flutter's wrapper already defaults BOTH --fatal-infos and
      # --fatal-warnings to on -- `flutter analyze --help` says so, and a tree
      # whose only diagnostic is a lint info exits 1. `dart analyze` does not.
      # So every diagnostic the analyzer emits fails this job, down to an info,
      # and that is deliberate: the Dart in this tree was written on a machine
      # with no toolchain, so this job and ci.yml's `dart` job are the first
      # things that can see a diagnostic at all. app/analysis_options.yaml
      # escalates unawaited_futures to an error on top of that, because an
      # unawaited future in provisioning is a step reporting success before it
      # finished.
      #
      # The obvious objection is a real one: with infos fatal, a flutter_lints
      # release that merely adds a lint would turn every branch red on a tree
      # nobody touched. What stops it is app/pubspec.lock -- committed, and
      # enforced by the step above, so flutter_lints cannot move here without a
      # commit that moves it. FLUTTER_VERSION does the same for the analyzer.
      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      # app/packages/singbox_tunnel holds the state machine that decides when
      # the app is allowed to say "Connected", and `flutter test` above never
      # sees a line of it: that command collects app/test/ and does not descend
      # into packages/, so a package with its own test suite is invisible to the
      # job whose name is "analyze and test".
      #
      # ANALYSIS is already covered, and that was measured rather than assumed:
      # `flutter analyze` from app/ walks the whole directory under
      # app/analysis_options.yaml, so a diagnostic planted in
      # packages/singbox_tunnel/lib/ is reported by the step above. This step is
      # about EXECUTION.
      #
      # The package has its own committed pubspec.lock, so this resolve cannot
      # move app/pubspec.lock, and --enforce-lockfile holds it for the same
      # reason it holds the one above.
      - name: flutter test (singbox_tunnel plugin)
        working-directory: app/packages/singbox_tunnel
        run: |
          flutter pub get --enforce-lockfile
          flutter test

  # sing-box's Android library is not published anywhere: the v1.14.0 release
  # carries 167 assets and not one .aar, so it has to be built from source with
  # SagerNet's gomobile fork. That is a Go toolchain plus an NDK, which is why it
  # is its own job and cached on the version rather than rebuilt for every commit
  # to a Dart file.
  #
  # The version is the SERVER's. compose.yml pins ghcr.io/sagernet/sing-box, and
  # a client built against a different minor parses a config the server's own
  # `check.sh` validated and then fails on the device -- the same drift
  # scripts/check.sh avoids by reading the tag out of compose.yml instead of
  # restating it. This job reads it from there too.
  libbox:
    name: libbox.aar (sing-box for Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.pin.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # working-directory defaults to app/ for the whole workflow; compose.yml is
      # at the repository root, which is why this one step overrides it.
      - name: Read the sing-box version the server runs
        id: pin
        working-directory: .
        run: |
          set -euo pipefail
          # Exactly one match is asserted, not assumed. `[ -n "$version" ]`
          # passes on two matches as happily as on one, and two matches arrive
          # as a single newline-joined string that is then handed to `git clone
          # --branch` and to a cache key -- so a second sing-box image line in
          # compose.yml would fail somewhere far from its cause.
          # scripts/check.sh guards the same read with `head -1`, which picks a
          # winner silently; naming the ambiguity is strictly better, because
          # the whole point of reading the tag out of one file is that one
          # number governs both ends of a configuration.
          #
          # Counted with grep and not `mapfile`, and ci.yml's reader of
          # FLUTTER_VERSION uses the same idiom for the same reason: this step
          # is byte-identical in the libbox and libbox_apple jobs, and
          # macos-latest still supplies bash 3.2, which has no `mapfile` at all.
          # One idiom that runs on both runners beats two that drift.
          pins=$(sed -n 's|^[[:space:]]*image:[[:space:]]*ghcr\.io/sagernet/sing-box:\(.*\)$|\1|p' compose.yml)
          found=$(printf '%s\n' "$pins" | grep -c . || true)
          [ "$found" -eq 1 ] || {
            echo "expected exactly one ghcr.io/sagernet/sing-box image pin in compose.yml, found $found: $(printf '%s' "$pins" | tr '\n' ' ')" >&2
            exit 1
          }
          version=$pins
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "server runs sing-box $version"

      - name: Restore a previously built libbox
        id: cached
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: libbox-out
          key: libbox-${{ steps.pin.outputs.version }}-api24-gomobile0.1.13

      - name: Install Go
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # sing-box v1.14.0's go.mod says `go 1.25.5`; an older toolchain refuses
          # the module outright.
          go-version: '1.25.5'
          # This repository has no go.sum -- the Go project is cloned into /tmp --
          # and the default cache lookup warns about that on every run.
          cache: false

      # The runner image already ships an NDK. Installing a second one cost a
      # failed job for nothing: sdkmanager is real but lives in
      # $ANDROID_SDK_ROOT/cmdline-tools/latest/bin, which is not on PATH, so the
      # step died with `sdkmanager: command not found`. Prefer what is there,
      # and fall back to installing by absolute path rather than by hope.
      - name: Point gomobile at an Android NDK
        if: steps.cached.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
            mgr="$sdk/cmdline-tools/latest/bin/sdkmanager"
            [ -x "$mgr" ] || { echo "no NDK and no sdkmanager under $sdk" >&2; exit 1; }
            yes | "$mgr" --licenses >/dev/null 2>&1 || true
            "$mgr" --install "ndk;27.2.12479018" >/dev/null
            ndk="$sdk/ndk/27.2.12479018"
          fi
          [ -d "$ndk" ] || { echo "NDK still missing at $ndk" >&2; exit 1; }
          echo "using NDK at $ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Build libbox from sing-box ${{ steps.pin.outputs.version }}
        if: steps.cached.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.pin.outputs.version }}" \
            https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          # Their own pinned fork, from the Makefile's lib_install target. Plain
          # golang.org/x/mobile does not build this.
          make lib_install
          export PATH="$(go env GOPATH)/bin:$PATH"
          make lib_android
          mkdir -p "$GITHUB_WORKSPACE/libbox-out"
          find . -name 'libbox*.aar' -exec cp {} "$GITHUB_WORKSPACE/libbox-out/" \;
          ls -la "$GITHUB_WORKSPACE/libbox-out/"

      - name: Fail if nothing was produced
        working-directory: .
        run: |
          set -euo pipefail
          # A cache hit that restored an empty directory looks like success and
          # then the Android job has no library to link. Check the artifact, not
          # the exit status of the build.
          test -s libbox-out/libbox.aar

      - name: Upload libbox.aar
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: libbox-${{ steps.pin.outputs.version }}
          path: libbox-out/*.aar
          if-no-files-found: error

  # The Apple half. It is NOT a mirror of the job above: what `-target apple`
  # emits was read out of cmd/internal/build_libbox/main.go at v1.14.0 and out
  # of the gomobile fork that Makefile pins, and four things differ.
  #
  # 1. The output is a DIRECTORY named Libbox.xcframework, and nothing on the
  #    command line says so. buildApple() (main.go:191) passes no -o, so
  #    gomobile falls back to strings.Title of the bound package's name --
  #    `libbox` -- and writes Libbox.xcframework into the clone's root
  #    (gomobile bind_iosapp.go:27). The -libname=box beside it names nothing
  #    here: bind.go:157 says "valid only with -target=android". Do not grep for
  #    a file.
  # 2. It binds FIVE platforms, not iOS: `ios,iossimulator,tvos,tvossimulator,
  #    macos` at -iosversion=15.0 -macosversion=13.0 -tvosversion=17.0
  #    (main.go:198-209). tvOS is dead weight for this repository and is built
  #    anyway, because `make lib_apple` is sing-box's single definition of this
  #    build and a hand-written -platform list here would be a second one that
  #    drifts from it -- the same reason the version is read out of compose.yml
  #    rather than restated. The cost is runner minutes; the cost of the other
  #    choice is a framework built differently from the one upstream tests.
  #    All five SDKs (iphoneos, iphonesimulator, appletvos, appletvsimulator,
  #    macosx) ship on the macos-latest image, so nothing is installed for it.
  # 3. It needs FULL XCODE, not the command line tools. gomobile refuses the
  #    target outright unless `xcrun xcodebuild -version` succeeds (bind.go:132
  #    calling env.go:644), and it then shells out to `xcodebuild
  #    -create-xcframework` (bind_iosapp.go:310) to combine the per-platform
  #    frameworks. A runner image is what supplies that; a developer's machine
  #    with only CLT installed fails at the first of those two checks with
  #    `-target=... requires Xcode`, before compiling anything.
  # 4. It needs no Android SDK, no NDK and no JDK. build_shared.FindSDK() and
  #    checkJavaVersion() are called from buildAndroid() only (main.go:161-162),
  #    so the NDK-hunting step the job above needs has no counterpart here.
  #
  # No `needs: check`, matching the libbox job above and unlike the five
  # platform jobs. Nothing here reads a line of Dart -- it clones sing-box and
  # builds Go -- so a red analyzer cannot make this output wrong, and gating it
  # would push the iOS artifact out by the whole of `check` on a cache miss.
  # The consequence is stated rather than hidden: a broken tree can still spend
  # a macOS runner here. It cannot produce an .ipa, because the job that does
  # `needs: check` as well.
  libbox_apple:
    name: Libbox.xcframework (sing-box for Apple)
    runs-on: macos-latest
    # The Android build takes about nine minutes for eight architecture slices.
    # This produces eight as well (ios/arm64, both simulator pairs, tvos/arm64,
    # macos/arm64+x86_64), then lipos and packs them, so the ceiling is set
    # generously rather than tightly: a hung xcodebuild should be killed, and a
    # merely slow one should not turn into a red build nobody trusts.
    timeout-minutes: 60
    outputs:
      version: ${{ steps.pin.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Byte-identical to the libbox job's step, deliberately: one number
      # governs the engine at both ends of a configuration, and it lives in
      # compose.yml. The expression is plain BRE with POSIX classes, so BSD sed
      # on this runner reads it the same way GNU sed does on the other.
      - name: Read the sing-box version the server runs
        id: pin
        working-directory: .
        run: |
          set -euo pipefail
          # Exactly one match is asserted, not assumed. `[ -n "$version" ]`
          # passes on two matches as happily as on one, and two matches arrive
          # as a single newline-joined string that is then handed to `git clone
          # --branch` and to a cache key -- so a second sing-box image line in
          # compose.yml would fail somewhere far from its cause.
          # scripts/check.sh guards the same read with `head -1`, which picks a
          # winner silently; naming the ambiguity is strictly better, because
          # the whole point of reading the tag out of one file is that one
          # number governs both ends of a configuration.
          #
          # Counted with grep and not `mapfile`, and ci.yml's reader of
          # FLUTTER_VERSION uses the same idiom for the same reason: this step
          # is byte-identical in the libbox and libbox_apple jobs, and
          # macos-latest still supplies bash 3.2, which has no `mapfile` at all.
          # One idiom that runs on both runners beats two that drift.
          pins=$(sed -n 's|^[[:space:]]*image:[[:space:]]*ghcr\.io/sagernet/sing-box:\(.*\)$|\1|p' compose.yml)
          found=$(printf '%s\n' "$pins" | grep -c . || true)
          [ "$found" -eq 1 ] || {
            echo "expected exactly one ghcr.io/sagernet/sing-box image pin in compose.yml, found $found: $(printf '%s' "$pins" | tr '\n' ' ')" >&2
            exit 1
          }
          version=$pins
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "server runs sing-box $version"

      # The cached thing is the TARBALL, not the bundle. actions/cache does
      # round-trip symlinks, but caching the unpacked directory would mean the
      # cache and the artifact hold different shapes and only one of them gets
      # exercised on a cache hit -- so a packing bug would surface on the first
      # cold run months later. Pack once, cache and upload the same bytes.
      - name: Restore a previously built Libbox.xcframework
        id: cached
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: libbox-apple-out
          key: libbox-apple-${{ steps.pin.outputs.version }}-gomobile0.1.13

      - name: Install Go
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # sing-box v1.14.0's go.mod says `go 1.25.5`; an older toolchain
          # refuses the module outright.
          go-version: '1.25.5'
          # This repository has no go.sum -- the Go project is cloned into /tmp
          # -- and the default cache lookup warns about that on every run.
          cache: false

      - name: Build Libbox.xcframework from sing-box ${{ steps.pin.outputs.version }}
        if: steps.cached.outputs.cache-hit != 'true'
        working-directory: .
        env:
          # macOS ships bsdtar with Apple's copyfile patch, which archives
          # extended attributes as AppleDouble `._name` members beside every
          # real one. Those are not part of the bundle and xcodebuild has no
          # idea what to do with an `._Info.plist` sitting next to Info.plist.
          COPYFILE_DISABLE: '1'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.pin.outputs.version }}" \
            https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          # Their own pinned fork, from the Makefile's lib_install target. Plain
          # golang.org/x/mobile does not build this, and the Apple path needs
          # both halves: gomobile shells out to `gobind` by PATH lookup
          # (bind.go:101), not by absolute path.
          make lib_install
          export PATH="$(go env GOPATH)/bin:$PATH"
          make lib_apple
          # Located rather than restated. The clone's root is where it lands
          # today -- buildApple()'s copy step only fires when a
          # ../sing-box-for-apple checkout exists (main.go:240) and there is
          # none here -- but the name is a gomobile default, so find it and say
          # so if it moves. -print -quit and not a pipe to head: under pipefail
          # a SIGPIPE'd find fails the step with find's exit code instead of
          # the message below, which is the opposite of legible.
          xcf=$(find . -maxdepth 2 -type d -name 'Libbox.xcframework' -print -quit)
          [ -n "$xcf" ] || { echo "make lib_apple produced no Libbox.xcframework -- the output name moved" >&2; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/libbox-apple-out"
          # tar, and not the directory handed straight to upload-artifact: see
          # the iOS job's unpack step for the measurement that forces this.
          tar -czf "$GITHUB_WORKSPACE/libbox-apple-out/Libbox.xcframework.tar.gz" \
            -C "$(dirname "$xcf")" Libbox.xcframework
          ls -la "$GITHUB_WORKSPACE/libbox-apple-out/"

      - name: Fail if nothing was produced
        working-directory: .
        run: |
          set -euo pipefail
          # A cache hit that restored an empty directory looks like success and
          # then the iOS job has no framework to link. Check the artifact, not
          # the exit status of the build -- and check the bundle, not the file,
          # because a truncated or half-written tarball passes `test -s` too.
          # An .xcframework IS its root Info.plist: that file is what lists the
          # available libraries, and a directory without one is not one.
          test -s libbox-apple-out/Libbox.xcframework.tar.gz
          tar -tzf libbox-apple-out/Libbox.xcframework.tar.gz > /tmp/xcframework-members
          grep -qx 'Libbox.xcframework/Info.plist' /tmp/xcframework-members \
            || { echo "no Info.plist at the bundle root -- this tarball is not an xcframework" >&2; exit 1; }
          echo "$(wc -l < /tmp/xcframework-members) members packed"

      - name: Upload Libbox.xcframework
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: libbox-apple-${{ steps.pin.outputs.version }}
          path: libbox-apple-out/Libbox.xcframework.tar.gz
          if-no-files-found: error
          # The payload is already gzipped. upload-artifact zips whatever it is
          # given at level 6 by default, which here is minutes of CPU spent
          # re-compressing incompressible bytes for no gain.
          compression-level: 0

  android:
    name: Android APK
    # libbox as well as check. app/packages/singbox_tunnel's Gradle module
    # refuses to configure without android/libs/libbox.aar, deliberately, and
    # its build.gradle says why: with the library absent the module still
    # compiles, still registers its channels and still produces an APK, which
    # then dies at the first connect with a ClassNotFoundException thrown from
    # inside a Go callback. The only place that .aar exists is the artifact the
    # libbox job uploads -- sing-box publishes none, and it is gitignored here
    # because it is 60 MB of built Go in a public repository.
    #
    # THE OTHER FOUR PLATFORM JOBS DELIBERATELY DO NOT LIST *THIS* ONE. iOS has
    # its own Go build to wait for now -- libbox_apple, above -- and waits for
    # that instead; an .aar is a JNI library and means nothing to it. The three
    # desktops link no Go library at all: app/README.md's table puts them on the
    # sing-box binary behind a privileged helper, which is a process, not a
    # dependency. A Windows runner queued behind a nine-minute NDK build it
    # never reads from is how a CI turns into something people skip.
    needs: [check, libbox]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Straight into the directory the plugin reads -- `file("libs/libbox.aar")`
      # in app/packages/singbox_tunnel/android/build.gradle, resolved against
      # that module -- rather than into a staging directory and a copy, so there
      # is one path to get wrong instead of two.
      #
      # `path:` is workspace-relative and therefore says app/:
      # `defaults.run.working-directory` governs `run` steps and not an action's
      # inputs, which is why every upload step in this file spells it the same
      # way and the `run` steps below do not.
      #
      # Before the toolchain installs: a wrong artifact name is cheaper to
      # discover ahead of two SDK downloads than behind them.
      - name: Download libbox ${{ needs.libbox.outputs.version }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: libbox-${{ needs.libbox.outputs.version }}
          path: app/packages/singbox_tunnel/android/libs

      # The assertion is not redundant with the plugin's own check, and the
      # difference is the failure this step is shaped around: a download that
      # lands half a directory off. `path:` above names a directory, so if the
      # artifact ever gains a level the bytes arrive at
      # libs/libbox-<version>/libbox.aar -- present, complete, and invisible to
      # `file("libs/libbox.aar")`. Asserted HERE because this is where the
      # artifact name is still in scope and the listing below can say where the
      # file really went, and because it runs BEFORE two SDK downloads and a
      # Gradle configure rather than five minutes into them.
      #
      # (packages/singbox_tunnel/android/build.gradle throws on the same missing
      # file and its message now names the `libbox` and `android` jobs by name,
      # so it is a good message in its own right -- it is just raised at the
      # wrong end of a toolchain install, and it cannot see the artifact name.)
      #
      # libbox-legacy.aar (the -androidapi 21 variant) rides along in the same
      # artifact and is left where it lands: build.gradle names libbox.aar
      # explicitly rather than globbing libs/, so nothing links the second file,
      # and deleting it here would be one more thing to revisit the day the
      # plugin's floor moves.
      - name: Check the .aar landed where Gradle looks for it
        run: |
          set -euo pipefail
          # find and not ls: if the artifact ever gains a directory level the
          # listing still shows where the file really is, which is the only
          # question worth answering when the test below fails.
          find packages/singbox_tunnel/android/libs -type f -printf '%10s  %p\n'
          test -s packages/singbox_tunnel/android/libs/libbox.aar

      # Gradle uses whatever JAVA_HOME the runner image happens to set, and that
      # moves with the image. Pin it: AGP in the current template needs 17+, and
      # "works until the image rolls" is not a build.
      - name: Install JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The platform directories are not committed (app/README.md: they are
      # scaffolding, they are large, and a hand-edited Xcode project is a file
      # nobody can review), so every platform job generates its own and only its
      # own. `flutter create` over an existing project writes only files that
      # are absent -- --overwrite defaults to false -- so lib/, test/,
      # pubspec.yaml and analysis_options.yaml are left exactly as checked out.
      # --project-name and --org are passed explicitly because they are only
      # consulted while generating, and nothing that records them is committed:
      # leave --org off and every artifact is stamped com.example forever. The
      # name must stay equal to `name:` in app/pubspec.yaml, and the org is the
      # repository owner lowercased, because an Android applicationId segment is
      # a Java identifier and nothing here is going near a store anyway.
      - name: Generate android/
        run: flutter create --platforms=android --project-name vpn_stack_app --org io.github.asel1x .

      # No minSdk edit here, and that was checked rather than assumed. The
      # plugin declares minSdk 24 because libbox is built `-androidapi 24`, and
      # the manifest merger refuses outright when a library's floor is above the
      # app module's -- but Flutter raised its own Android minimum from 21 to 24
      # in 3.35, and 3.47 lists "Supported: 24 to 37, Unsupported: 23 and
      # earlier" (docs.flutter.dev/reference/supported-platforms), so the
      # `minSdk = flutter.minSdkVersion` that `flutter create` writes above is
      # already 24. Nothing patches a generated file. If this step ever fails
      # with "uses-sdk:minSdkVersion N cannot be smaller than version 24
      # declared in library", that is the number that moved, and the fix is one
      # of the two floors, not a sed over scaffolding.
      - name: flutter build apk --release
        run: flutter build apk --release

      # Is the Go library actually INSIDE the apk?
      #
      # Two checks already stand between here and an apk with no tunnel in it,
      # and neither answers this question. The plugin's build.gradle throws when
      # android/libs/libbox.aar is absent, which proves the .aar was on the
      # classpath; the download step above proves it landed at the path Gradle
      # reads. Packaging is a third thing, and it is the one that has already
      # gone wrong here: build.gradle's own comment records
      # `:app:mergeReleaseNativeLibs` failing with "Could not find :libbox:,
      # required by project ':app'" -- the classes resolved and the .so had
      # nowhere to come from. A flatDir repository declared on every project
      # fixed it, and nothing asserted it stayed fixed.
      #
      # The expected name and the expected ABI set are read OUT OF THE .aar
      # rather than written here. The first version of this step asserted
      # `libgojni.so`, which is what `gomobile bind` produces by default, and it
      # failed on an apk that was perfectly correct: sing-box's own build passes
      # a library name, so the file is `libbox.so`. A check that hardcodes what
      # it expects to find is a check that fails when the build is right and
      # passes when the .aar quietly ships fewer architectures than it used to.
      # Reading both from the artifact closes the second case as well: an .aar
      # with three ABIs and an apk with two is a silent loss of a platform.
      - name: The apk carries the library the .aar shipped, for every ABI
        run: |
          aar=packages/singbox_tunnel/android/libs/libbox.aar
          apk=build/app/outputs/flutter-apk/app-release.apk
          # `|| true` on both: unzip exits non-zero when a pattern matches
          # nothing, and GitHub runs this under `bash -e`, so without it the step
          # dies on unzip's own "caution: filename not matched" instead of on the
          # sentence that says what that means.
          jni=$(unzip -Z1 "$aar" 'jni/*/*.so' 2>/dev/null | sort || true)
          [ -n "$jni" ] || { echo "$aar ships no jni/<abi>/*.so -- it is not a gomobile library" >&2; exit 1; }
          echo "the .aar ships:"; printf '  %s\n' $jni
          libs=$(unzip -Z1 "$apk" 'lib/*/*.so' 2>/dev/null | sort || true)
          echo "the apk carries:"; printf '  %s\n' $libs
          rc=0
          for entry in $jni; do
            abi=$(printf '%s' "$entry" | awk -F/ '{print $2}')
            so=$(printf '%s' "$entry" | awk -F/ '{print $3}')
            printf '%s\n' $libs | grep -qx "lib/$abi/$so" || {
              echo "MISSING lib/$abi/$so: the .aar ships it and the apk does not," >&2
              echo "so on a $abi device this build dies at the first connect," >&2
              echo "inside a Go callback, which is the least legible place for it" >&2
              rc=1
            }
          done
          exit $rc

      - name: Upload the APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # Is the Xcode project in the tree? Everything iOS below branches on this one
  # answer, and that is what makes the workflow self-healing: with no project it
  # generates one, with a project it builds it, and neither needs a human to
  # remember which. The alternative it replaced was a recovery instruction
  # nobody could follow -- see the `on:` block above for why the dispatch route
  # it named does not exist -- while every push stayed red on a job whose fix
  # could not be run.
  ios_state:
    name: Is the Xcode project committed?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      committed: ${{ steps.look.outputs.committed }}
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Look for it
        id: look
        working-directory: .
        run: |
          set -euo pipefail
          if [ -f app/ios/Runner.xcodeproj/project.pbxproj ]; then
            echo "committed=true" >> "$GITHUB_OUTPUT"
            echo "app/ios/ is in the tree; the ios job will build it"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "app/ios/ is absent; the ios_project job will generate one to commit"
          fi

  # THIS JOB REGENERATES app/ios/. IT DOES NOT BUILD ON EVERY RUN, AND MUST NOT.
  #
  # app/ios/ is a COMMITTED directory -- the one platform directory that is, and
  # not out of taste. iOS runs an NEPacketTunnelProvider in its own app-extension
  # PROCESS, so the provider needs its own TARGET; a CocoaPods pod is linked into
  # the targets the Podfile names, which is Runner and nothing else, which is why
  # packages/singbox_tunnel/ios/singbox_tunnel.podspec:32 ships Classes/ and
  # Shared/ and deliberately not Extension/. `flutter create` writes one target,
  # no entitlements, no App Group and no extension, and preserves none of those
  # if you add them. A colleague cannot sign a project that does not exist.
  #
  # So: delete app/ios/ and push. This job generates a project, builds it,
  # uploads it as the ios-project artifact, and a human commits that. The `ios`
  # job below then builds THAT project on every push and never generates one.
  # Regenerating on every run would mean the thing that ships is rewritten
  # behind the operator's back, which is the failure committing it exists to
  # prevent -- so the trigger is the directory's absence and nothing else. There
  # is no manual override, because the button that would offer one is not
  # rendered for a workflow outside the default branch; the `on:` block says so
  # at length.
  #
  # It deletes app/ios/ before generating anyway, belt and braces. `flutter
  # create` over an existing project writes only absent files, so a second pass
  # would merge a fresh template into an edited project -- the unreviewable
  # state this whole arrangement avoids -- and tool/ios_project.rb refuses to
  # run twice over one project for the same reason.
  #
  # It also BUILDS what it generated, which is what `needs: libbox_apple` is for.
  # A project a human is about to commit should be known to compile the 827 lines
  # under packages/singbox_tunnel/ios/Extension/ before it is committed, not
  # after. The build steps are spelled out again rather than shared with the
  # `ios` job on purpose: that job builds the COMMITTED project and this one
  # builds the GENERATED one, and if they shared steps the difference -- which is
  # the entire point of both -- would be invisible.
  ios_project:
    name: regenerate app/ios/
    if: needs.ios_state.outputs.committed == 'false'
    needs: [check, libbox_apple, ios_state]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # xcodeproj is not listed on the runner image by name; it arrives as a
      # runtime dependency of CocoaPods, which is listed ("CocoaPods 1.17.0" in
      # images/macos/macos-26-arm64-Readme.md), and cocoapods 1.17.0's gemspec
      # declares `xcodeproj >= 1.28.1, < 2.0`. That is the whole provenance, and
      # it is a property of an image that rolls, so it is asserted and printed
      # here rather than assumed three steps later inside a Ruby backtrace.
      - name: Check the xcodeproj gem is on this runner
        run: |
          set -euo pipefail
          gem list -e xcodeproj || true
          ruby -e 'require "xcodeproj"; puts "xcodeproj #{Xcodeproj::VERSION}"' \
            || { echo "error: no xcodeproj gem. It ships as a dependency of CocoaPods; the runner image dropped one of them, and this job needs a gem install step." >&2; exit 1; }

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # --project-name and --org are the same pair the android job passes and
      # are not decoration here: `flutter create` derives the app's bundle
      # identifier from them (createUTIIdentifier, create_base.dart:595), and
      # tool/ios_project.rb refuses to continue unless that identifier is
      # io.github.asel1x.vpnStackApp -- the App Group and the extension's own
      # identifier are built from it, and the App Group is registered against a
      # real Apple team.
      - name: Generate a stock ios/ from the Flutter template
        run: |
          set -euo pipefail
          rm -rf ios
          flutter create --platforms=ios --project-name vpn_stack_app --org io.github.asel1x .
          test -f ios/Runner.xcodeproj/project.pbxproj

      - name: Add the packet-tunnel extension target
        run: ruby tool/ios_project.rb

      # Before the build, for the reason the pubspec.lock step gives: a failed
      # build should still hand back the project that failed, or the next person
      # debugs an Xcode project on a machine with no Xcode.
      #
      # include-hidden-files, and it is load-bearing rather than tidy:
      # `flutter create` writes ios/.gitignore, and that file is what makes
      # committing this directory safe at all -- it already ignores
      # Flutter/Generated.xcconfig, Flutter/flutter_export_environment.sh,
      # Flutter/ephemeral/, Pods/, .symlinks/, xcuserdata and
      # Runner/GeneratedPluginRegistrant.*. upload-artifact drops dotfiles by
      # default, so without this the artifact arrives missing the one file that
      # keeps every derived path out of the commit.
      #
      # The two absolute-path files are excluded here as well, because an
      # artifact a human unzips should not contain the runner's FLUTTER_ROOT in
      # the first place; .gitignore:36 objects to exactly that, and every
      # flutter build rewrites both. Nothing else under ios/ is derived:
      # Runner.xcodeproj, the two entitlements files and the two Info.plists are
      # the deliverable.
      - name: Upload app/ios/ for a human to commit
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ios-project
          path: |
            app/ios
            !app/ios/Flutter/Generated.xcconfig
            !app/ios/Flutter/flutter_export_environment.sh
            !app/ios/Flutter/ephemeral
          include-hidden-files: true
          if-no-files-found: error

      - name: Download Libbox.xcframework ${{ needs.libbox_apple.outputs.version }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: libbox-apple-${{ needs.libbox_apple.outputs.version }}
          path: app/packages/singbox_tunnel/ios/Frameworks

      - name: Unpack Libbox.xcframework
        run: bash tool/unpack_libbox.sh

      - name: flutter build ios --no-codesign
        run: flutter build ios --release --no-codesign

      - name: Check the extension was built into the app
        run: bash tool/check_extension.sh

  ios:
    name: iOS .ipa (unsigned)
    # Only with a project to build. Without this the job failed on every push and
    # the failure was not actionable, because the route it told people to take --
    # a manual dispatch -- is not offered for a workflow outside the default
    # branch. `ios_state` decides instead, and `ios_result` below is what makes
    # sure this job and `ios_project` did not BOTH stand down.
    if: needs.ios_state.outputs.committed == 'true'
    # libbox_apple as well as check, and macos/windows/linux deliberately still
    # do not. The xcframework carries a macos slice -- build_libbox binds one
    # (main.go:198) whether anything wants it or not -- so the temptation is to
    # hand it to the macOS job too. Nothing there would link it:
    # app/README.md's table puts macOS, Windows and Linux on the sing-box
    # *binary* behind a privileged helper, and there is no macOS Network
    # Extension target in this tree to link a framework into. Adding the
    # dependency would park a second macOS runner behind a Go build whose
    # output it never opens. The day a macOS helper wants libbox instead of the
    # binary, the slice is already in the artifact and this is one line.
    needs: [check, libbox_apple, ios_state]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # THIS JOB BUILDS THE COMMITTED PROJECT AND GENERATES NOTHING. There is no
      # `flutter create` below, and its absence is the point: every way of
      # getting this wrong ends in a build that SUCCEEDS. A stock one-target
      # project compiles the Dart and the app-process Swift, links no libbox,
      # contains no NEPacketTunnelProvider, and wraps into a perfectly valid
      # .ipa that cannot tunnel -- indistinguishable from a real one until
      # somebody signs and installs it. So the project is checked by hand, first,
      # before the artifact download and the SDK install.
      - name: Check the committed Xcode project is here and carries the extension
        working-directory: .
        run: |
          set -euo pipefail
          pbxproj=app/ios/Runner.xcodeproj/project.pbxproj
          if [ ! -f "$pbxproj" ]; then
            echo "error: no $pbxproj." >&2
            echo "app/ios/ is a committed directory and nothing in this job generates one." >&2
            echo "This should be unreachable: the ios_state job reported the project committed," >&2
            echo "so either it read a different path or the checkout is not the tree it read." >&2
            echo "Produce a project: delete app/ios/ and push. ios_state then reports it absent," >&2
            echo "the ios_project job regenerates it and uploads the ios-project artifact, and you" >&2
            echo "commit that. The why is in packages/singbox_tunnel/ios/README.md and in the" >&2
            echo "ios_project job above." >&2
            exit 1
          fi
          # A project that exists but predates the extension target is the same
          # silent failure wearing a committed directory, so the contents are
          # asserted too, by the three strings that cannot be there by accident.
          for needle in \
            'com.apple.product-type.app-extension' \
            'io.github.asel1x.vpnStackApp.SingboxTunnel' \
            'Libbox.xcframework'
          do
            grep -q "$needle" "$pbxproj" || {
              echo "error: $pbxproj does not mention $needle -- this project predates the extension target." >&2
              echo "Regenerate it with the ios_project job and commit the result." >&2
              exit 1
            }
          done
          test -f app/ios/SingboxTunnel/SingboxTunnel.entitlements
          test -f app/ios/SingboxTunnel/Info.plist
          test -f app/ios/Runner/Runner.entitlements

      # The other half of that assertion, and the half only this runner can do.
      # The grep above finds three strings; --check OPENS Runner.xcodeproj with
      # the xcodeproj gem and compares every setting against the tables
      # tool/ios_project.rb generates from, so a committed project that has
      # drifted from its generator -- by a hand edit, or by a change to the
      # script that nobody re-ran -- is named here rather than discovered as a
      # tunnel that will not start. app/ios/ is a committed GENERATED artefact,
      # which is exactly the shape that drifts silently.
      #
      # It lives in this job and not in the cheap `check` one because the gem
      # does: xcodeproj arrives as a dependency of CocoaPods, which only the
      # macOS images carry. `check` runs `ruby -c` on the script (a parse) and
      # `tool/check_extension.sh sources` over the same identifiers with awk and
      # grep, which is the portable subset of this assertion; --check is the
      # version that reads the project as a project.
      #
      # Before the framework download and the Flutter install, for the reason
      # the step above gives: a project that cannot pass this is not worth an
      # SDK.
      - name: Check the committed project still matches tool/ios_project.rb
        run: ruby tool/ios_project.rb --check

      # Straight into the directory the extension target links from --
      # FRAMEWORK_SEARCH_PATHS is $(SRCROOT)/../packages/singbox_tunnel/ios/Frameworks
      # and the file reference in Runner.xcodeproj is the same path -- rather
      # than into a staging directory and a copy, so there is one path to get
      # wrong instead of two. This is the move ios/README.md:168 describes: the
      # unpack destination used to be libbox-apple/ at the repository root,
      # where nothing consumed it and the job proved only that the framework
      # survived the round trip.
      #
      # Before the toolchain installs, for the reason the Android job gives: a
      # wrong artifact name is cheaper to discover ahead of an SDK download than
      # behind one.
      - name: Download Libbox.xcframework ${{ needs.libbox_apple.outputs.version }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: libbox-apple-${{ needs.libbox_apple.outputs.version }}
          path: app/packages/singbox_tunnel/ios/Frameworks

      - name: Unpack Libbox.xcframework
        run: bash tool/unpack_libbox.sh

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter build ios --no-codesign
        run: flutter build ios --release --no-codesign

      - name: Check the extension was built into the app
        run: bash tool/check_extension.sh

      # `flutter build ipa` cannot be used here: exporting an archive is an
      # Xcode signing operation and there is no identity on this runner. An .ipa
      # is a zip with the .app under Payload/, so build that shape directly.
      # It is installable by nothing -- no device, no simulator, no TestFlight
      # -- until it is re-signed. It exists so the iOS target is proven to
      # compile on every push instead of rotting until somebody pays Apple.
      - name: Wrap Runner.app as an unsigned .ipa
        shell: bash
        run: |
          set -euo pipefail
          app=build/ios/iphoneos/Runner.app
          [ -d "$app" ] || { echo "no $app -- the iOS output layout moved" >&2; exit 1; }
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$app" build/ipa/Payload/
          cd build/ipa && zip -qry vpn-stack-app-unsigned.ipa Payload

      - name: Upload the .ipa
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ios-ipa-unsigned
          path: app/build/ipa/vpn-stack-app-unsigned.ipa
          if-no-files-found: error

  macos:
    name: macOS app
    needs: check
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate macos/
        run: flutter create --platforms=macos --project-name vpn_stack_app --org io.github.asel1x .

      - name: flutter build macos --release
        run: flutter build macos --release

      # upload-artifact does not preserve the executable bit or symlinks, and a
      # .app is a directory that is nothing but those two things: uploaded raw
      # it downloads as a bundle that cannot launch. ditto archives it the way
      # the platform expects, and the artifact zip then just carries one file.
      - name: Archive the .app
        shell: bash
        run: |
          set -euo pipefail
          rel=build/macos/Build/Products/Release
          [ -d "$rel" ] || { echo "no $rel -- the macOS output layout moved" >&2; exit 1; }
          # -print -quit rather than a pipe to head: under pipefail a SIGPIPE'd
          # find fails the step with find's exit code instead of the message
          # below, which is the opposite of legible.
          app=$(find "$rel" -maxdepth 1 -name '*.app' -print -quit)
          [ -n "$app" ] || { echo "no .app in $rel -- the build produced nothing to archive" >&2; exit 1; }
          ditto -c -k --keepParent "$app" build/vpn-stack-app-macos.zip

      - name: Upload the macOS app
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: macos-app
          path: app/build/vpn-stack-app-macos.zip
          if-no-files-found: error

  windows:
    name: Windows exe
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate windows/
        run: flutter create --platforms=windows --project-name vpn_stack_app --org io.github.asel1x .

      - name: flutter build windows --release
        run: flutter build windows --release

      # The whole Release directory, not just the .exe: the launcher is useless
      # without flutter_windows.dll, the plugin DLLs beside it and data/, which
      # holds the AOT blob and the ICU data. Shipping the bare .exe produces a
      # download that fails at startup with a missing-DLL box and no clue.
      # upload-artifact zips the directory, so the artifact is already the
      # archive a human wants. (Path note: Flutter moved this out of
      # build/windows/runner/Release into the x64/ level -- if this step ever
      # reports no files, look there first.)
      - name: Upload the Windows build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-x64
          path: app/build/windows/x64/runner/Release
          if-no-files-found: error

  linux:
    name: Linux .deb
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Flutter's Linux embedder links against GTK 3 and builds with clang and
      # ninja; the runner image ships neither the GTK headers nor liblzma's.
      # dpkg-dev is what provides dpkg-shlibdeps below.
      #
      # libsecret-1-dev is not optional and is not about GTK: app/pubspec.yaml
      # declares flutter_secure_storage, whose Linux implementation opens its
      # CMakeLists with
      #   pkg_check_modules(LIBSECRET REQUIRED IMPORTED_TARGET libsecret-1>=0.18.4)
      # -- REQUIRED, so without the headers the plugin's CMake CONFIGURE step
      # fails, which means `flutter build linux` never compiles anything, the
      # .deb is never packaged and the upload never runs. The whole job is red
      # on a missing -dev package, not on any code in this tree. If
      # flutter_secure_storage ever leaves pubspec.yaml, this package leaves
      # with it.
      #
      # Nothing below needs editing for the runtime half: the plugin's .so lands
      # in the bundle's lib/, and dpkg-shlibdeps reads its NEEDED entries and
      # puts libsecret-1-0 in Depends by itself. That is the point of measuring
      # the list rather than writing it.
      #
      # libjsoncpp-dev is deliberately NOT here. The plugin needed it once and
      # its 1.2.0 changelog is "Remove and replace libjsoncpp1 dependency"
      # (it bundles a header-only JSON library now); flutter_secure_storage
      # 11.x -- what an unpinned `flutter_secure_storage:` resolves to -- will
      # not accept a Linux implementation below 3.0.1, so nothing in the
      # resolvable range asks for it. Installing it anyway would be a package
      # nobody links, kept alive by a stale memory of an old release note.
      - name: Install the GTK and libsecret build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev dpkg-dev \
            libsecret-1-dev

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate linux/
        run: flutter create --platforms=linux --project-name vpn_stack_app --org io.github.asel1x .

      - name: flutter build linux --release
        run: flutter build linux --release

      # Flutter's Linux output is a bundle directory -- launcher, lib/, data/ --
      # and not a package. Everything below turns that into one, by hand,
      # because there is no `flutter build deb`.
      #
      # Depends is MEASURED, never written out from memory. dpkg-shlibdeps reads
      # the NEEDED entries of the launcher and of every .so Flutter bundles and
      # asks dpkg which package owns each one, which is exactly what a real
      # Debian build does. A hand-guessed list is how you ship a .deb that
      # installs cleanly and then dies on the first launch with a missing
      # libgtk symbol -- the failure this whole step is shaped to avoid. The
      # consequence to know: the answer describes THIS runner's distribution, so
      # the package targets that release (Ubuntu's t64 ABI transition renamed
      # half these packages, so a .deb built here will refuse to install on
      # Ubuntu 22.04 or Debian 12 rather than install and break). Building for
      # an older target means building on an older container, not editing the
      # list by hand.
      - name: Build the .deb
        shell: bash
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          # Every mode in the package comes from this process's umask. The
          # runner's default is already 022; stating it means the package does
          # not change shape because an image did.
          umask 022

          pkgname=vpn-stack-app
          bundle=build/linux/x64/release/bundle
          [ -d "$bundle" ] || { echo "no bundle at $bundle -- the Linux output layout moved" >&2; exit 1; }
          bundle=$(realpath "$bundle")

          # The bundle root holds exactly one executable file, named after the
          # project by CMake. Find it rather than restate the name here, where a
          # rename would go unnoticed until the .desktop entry pointed at
          # nothing.
          mapfile -t bins < <(find "$bundle" -maxdepth 1 -type f -executable -printf '%f\n')
          [ "${#bins[@]}" -eq 1 ] || { echo "expected one executable at the bundle root, found: ${bins[*]:-none}" >&2; exit 1; }
          binary=${bins[0]}

          version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          [ -n "$version" ] || { echo "no version: in pubspec.yaml" >&2; exit 1; }
          arch=$(dpkg --print-architecture)

          # Stage into debian/<package>/, where a real Debian build stages,
          # because dpkg-shlibdeps resolves the launcher's $ORIGIN RPATH
          # relative to the root of that tree -- and $ORIGIN/lib is exactly
          # where Flutter puts its private libraries. Run it over the loose
          # bundle instead and it says so ("the corresponding directory could
          # not be identified due to lack of DEBIAN sub-directory"), losing its
          # only way to tell that libflutter_linux_gtk.so ships inside this very
          # package rather than being a dependency it failed to find.
          work=$(mktemp -d)
          root=$work/debian/$pkgname
          libdir=usr/lib/$pkgname
          install -d -m 0755 "$root/DEBIAN" "$root/$libdir" "$root/usr/bin" "$root/usr/share/applications"
          cp -r "$bundle"/. "$root/$libdir/"
          # mktemp -d is 0700 whatever the umask, and this directory becomes the
          # package's "/" entry -- unfixed, the mode rides into the .deb.
          chmod 0755 "$root"
          find "$root/usr" -type d -exec chmod 0755 {} +

          # A symlink and not a wrapper script: the launcher locates data/ and
          # lib/ from /proc/self/exe, which resolves through the symlink to the
          # real directory. A copy in /usr/bin would find neither.
          ln -s "/$libdir/$binary" "$root/usr/bin/$pkgname"

          # dpkg-shlibdeps refuses to do anything outside a source package, so
          # give it the smallest debian/control that parses. --ignore-missing-info
          # is required because the bundled libflutter_linux_gtk.so belongs to no
          # package and would otherwise be a hard error rather than a warning;
          # -l puts it on the search path so the libraries IT needs still
          # resolve.
          cat > "$work/debian/control" <<EOF
          Source: $pkgname
          Maintainer: vpn-stack <$REPO_URL>

          Package: $pkgname
          Architecture: $arch
          EOF
          depends=$(cd "$work" && dpkg-shlibdeps -O --ignore-missing-info \
            -l"debian/$pkgname/$libdir/lib" \
            "debian/$pkgname/$libdir/$binary" "debian/$pkgname/$libdir"/lib/*.so \
            | sed -n 's/^shlibs:Depends=//p')
          [ -n "$depends" ] || { echo "dpkg-shlibdeps computed no Depends; refusing to ship a package that claims it needs nothing" >&2; exit 1; }

          cat > "$root/usr/share/applications/$pkgname.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=VPN Stack
          Comment=Provision a server and connect to it
          Exec=/usr/bin/$pkgname
          Terminal=false
          Categories=Network;
          EOF

          # Maintainer is the repository, deliberately: this is built by CI from
          # a public tree and there is no person to mail about it.
          cat > "$root/DEBIAN/control" <<EOF
          Package: $pkgname
          Version: $version
          Section: net
          Priority: optional
          Architecture: $arch
          Depends: $depends
          Installed-Size: $(du -ks "$root/usr" | cut -f1)
          Maintainer: vpn-stack <$REPO_URL>
          Homepage: $REPO_URL
          Description: Client for the vpn-stack CLI
           Provisions a server over SSH and connects to it. Talks to vpnctl
           through its --json interface; implements none of the server itself.
           This build is unsigned.
          EOF

          # --root-owner-group: without it every path in the package is owned by
          # the runner's uid, which dpkg then installs as-is.
          deb="$PWD/build/${pkgname}_${version}_${arch}.deb"
          dpkg-deb --root-owner-group --build "$root" "$deb"
          # Echoed so a failure email, or a doubt about Depends, is answerable
          # from the log without downloading anything.
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

      - name: Upload the .deb
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-deb
          path: app/build/*.deb
          if-no-files-found: error

  # A SKIPPED JOB IS NOT A FAILURE, and that is the hole this closes.
  #
  # `ios` and `ios_project` are mutually exclusive by construction -- ios_state
  # decides which of them runs -- so exactly one should have succeeded on every
  # run. GitHub renders "skipped" as neither red nor green, so a state where
  # NEITHER ran is indistinguishable from success on the Actions page: a renamed
  # output, a typo in an `if:`, or a `committed=` value that is neither 'true'
  # nor 'false' would ship a green run in which nothing built the iOS target and
  # nothing regenerated it, on the one platform whose project is committed and
  # whose extension no device has ever run.
  #
  # The trade-off, stated the way the rest of this file states them: one extra
  # ubuntu job on every run, a few seconds long, in exchange for turning a
  # silence into a signal. It also reddens twice when `check` fails -- both iOS
  # jobs are skipped, so this one reports zero successes -- which is noise, and
  # cheaper than the alternative of trusting a skip.
  #
  # `if: always()` is load-bearing: without it this job inherits the skip from
  # its own dependencies and proves nothing, which is the failure it exists to
  # catch wearing one more layer. It reads `needs.*.result` and not the
  # artifacts, deliberately -- what it asserts is that the workflow DECIDED, and
  # Xcode's opinion is the two jobs' own business.
  ios_result:
    name: Exactly one iOS job ran
    needs: [ios, ios_project]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require exactly one success
        working-directory: .
        run: |
          set -euo pipefail
          built='${{ needs.ios.result }}'
          regenerated='${{ needs.ios_project.result }}'
          echo "ios=$built  ios_project=$regenerated"
          # `case` and not `[ ... ] && n=$((n + 1))`: under `set -e` a failing
          # test as the left half of an && list ends the step, which would
          # report "no successes" as a shell error instead of as this message.
          ok=0
          case "$built" in success) ok=$((ok + 1)) ;; esac
          case "$regenerated" in success) ok=$((ok + 1)) ;; esac
          [ "$ok" -eq 1 ] || {
            echo "error: expected exactly one of ios/ios_project to succeed, counted $ok." >&2
            echo "Two successes means they are no longer mutually exclusive -- check both \`if:\`" >&2
            echo "conditions against the ios_state job's committed= output." >&2
            echo "Zero means neither ran (or the one that ran failed): if both are 'skipped', the" >&2
            echo "branch decided nothing and no iOS target was built or regenerated at all." >&2
            exit 1
          }
          echo "exactly one iOS job succeeded"
