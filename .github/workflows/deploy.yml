name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Autodeploy is opt-in: until DEPLOY_HOST and DEPLOY_SSH_KEY exist, a push
      # should be a no-op, not a red X. A workflow that always fails is a
      # workflow people stop reading.
      - name: Are the deploy secrets configured?
        id: gate
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [[ -n "$HOST" && -n "$KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_HOST/DEPLOY_SSH_KEY not set - skipping deploy."
          fi

      - name: Set up SSH
        if: steps.gate.outputs.ready == 'true'
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # One deploy path, called from two places. CI and `./vpn deploy` run the
      # identical script, so the manual route cannot drift from the automated
      # one -- which is what made the old hand-written rsync dangerous.
      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        env:
          SSH_OPTS: "-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          REPO_PATH: /opt/vpn-stack
        run: bash scripts/deploy.sh "root@${{ secrets.DEPLOY_HOST }}"
