volumes:
  ikev2-vpn-data:

services:
  ikev2:
    image: hwdsl2/ipsec-vpn-server
    container_name: ipsec-vpn-server
    restart: always
    network_mode: host
    # TEMPORARY diagnostic: switched from non-privileged (cap_add: NET_ADMIN
    # + devices: /dev/ppp, see git history) to privileged: true to test
    # whether capability mode is a factor in the IKEv2 connectivity
    # investigation. host-bootstrap.sh's sysctls are still required either
    # way -- network_mode: host blocks Compose's `sysctls:` regardless of
    # privilege level. Revert to the non-privileged block once this is
    # answered.
    privileged: true
    env_file:
      - ./ikev2/.env
    volumes:
      - ikev2-vpn-data:/etc/ipsec.d
      - /lib/modules:/lib/modules:ro

  sing-box:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: sing-box
    restart: always
    network_mode: host
    volumes:
      - ./sing-box:/etc/sing-box:ro
      - ./data:/var/lib/sing-box
    command: >-
      -D /var/lib/sing-box
      -C /etc/sing-box/common
      -C /etc/sing-box/vless-reality
      -C /etc/sing-box/hysteria2
      run
