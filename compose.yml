# Pinned so the project name -- and therefore volume names and orphan scope --
# never depends on what the checkout directory happens to be called.
name: vpn-stack

# Docker's json-file driver keeps every line forever unless max-size is set, and this box
# shares one 9.8 GB disk with the infra stack and its databases. Five services were writing
# uncapped: quiet today at a handful of lines an hour, but sing-box under load and dnstt
# under junk traffic are not quiet, and the container that fills the disk is not
# necessarily the one that suffers for it.
#
# 10m x 3 matches every other service on this host, so "how much log does a container get
# to keep" is one answer rather than per-stack folklore.
#
# A disk budget, and nothing more. How much a service says -- sing-box's log level, which
# is a privacy decision about what gets written down at all -- is settled in that service's
# own rendered config, not here. Turning a service quieter does not make this cap wrong; it
# only makes it rotate less often.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

volumes:
  ikev2-vpn-data:
  # The dnstt SSH front's host key. Regenerating it on every restart would make
  # every client warn about a changed server; baking it into the image would
  # give every deployment the same one.
  dnstt-sshd-keys:

services:
  # ---------------------------------------------------------------- sing-box
  # One -C directory, always. The config tree is rendered by `vpnctl apply`
  # into ${VPN_STATE:-/etc/vpn-stack}/rendered/sing-box and promoted by an
  # atomic symlink swap, so this mount is never half-written. certs/ rides
  # inside it: -C merges *.json and does not recurse, so a subdirectory is
  # invisible to the config loader.
  sing-box:
    # Pinned. `latest` means the next `apply` can pull a release that dropped
    # a config key this repo still uses, and the failure lands on a live server
    # with no way back -- exactly what the candidate-tree design exists to
    # prevent. Bump deliberately, with scripts/check.sh to prove it first.
    #
    # PINNED BY TAG, AND THE TAG FORM IS LOAD-BEARING -- this is the one pin in
    # this file that must not become a digest. Three readers sed the version out
    # of this line and every one of them matches on `sing-box:<tag>`:
    # scripts/check.sh, which validates the candidate config against the binary
    # that will serve it, and the libbox and libbox_apple jobs in
    # .github/workflows/app.yml, which build the client's engine from the same
    # source version so one number governs both ends of a configuration. Write
    # `sing-box@sha256:...` here, the way ikev2 below is written, and all three
    # stop matching. They fail loudly rather than validating against the wrong
    # binary -- check.sh exits 2, the workflow jobs exit 1 having found zero
    # pins -- so the cost is three red builds and not a silent mismatch. Pinning
    # ikev2 by digest is safe for the opposite reason: nothing reads it.
    image: ghcr.io/sagernet/sing-box:v1.14.0
    container_name: sing-box
    logging: *logging
    restart: always
    network_mode: host
    volumes:
      - ${VPN_STATE:-/etc/vpn-stack}/rendered/sing-box:/etc/sing-box:ro
      - ${VPN_STATE:-/etc/vpn-stack}/data:/var/lib/sing-box
    command: -D /var/lib/sing-box -C /etc/sing-box run

  # ------------------------------------------------------------------- ikev2
  # Not privileged: cap_add + /dev/ppp is the image's own documented
  # non-privileged mode. The sysctls it also wants cannot be set through
  # compose under network_mode: host (no separate netns), so they live on the
  # host -- see scripts/install.sh.
  #
  # Diagnosed 2026-09-08: the server side of IKEv2 is correct end to end and
  # no client IKE has ever reached it. A DPI box inside the client's ISP drops
  # UDP whose payload parses as an ISAKMP header, toward foreign destinations
  # only. Nothing here can change that, and moving IKE to another UDP port does
  # not help -- the filter ignores the port. See CLAUDE.md, "IKEv2 client
  # connectivity", and scripts/diagnose-ikev2.sh before spending time here.
  ikev2:
    # Pinned by digest. ikev2ctl.py hard-codes this image's CLI contract --
    # --addclient / --deleteclient / --revokeclient / --exportclient, and the
    # absence of --removeclient. An unpinned tag means an upstream change to
    # any of those silently breaks user management on the next pull.
    image: hwdsl2/ipsec-vpn-server@sha256:2e939ffe5913c9a34a3f5b72d75a97e9a2f16824d223bf042b88a567ffeabe9b
    container_name: ipsec-vpn-server
    logging: *logging
    restart: always
    network_mode: host
    profiles: ["ikev2"]
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/ppp:/dev/ppp"
    # required: false because the file only exists while the protocol is on.
    # Compose validates env_file when it loads the project, not when it starts
    # the service, so a plain path here makes every `docker compose` command
    # fail once `vpn protocol off ikev2` stops rendering it -- including the
    # ones that bring sing-box up.
    env_file:
      - path: ${VPN_STATE:-/etc/vpn-stack}/rendered/ikev2.env
        required: false
    volumes:
      - ikev2-vpn-data:/etc/ipsec.d
      - /lib/modules:/lib/modules:ro

  # ------------------------------------------------------------------- dnstt
  # Off by default: needs a delegated DNS zone, which a fresh server has not
  # got, and udp/53 on a box without one is pure attack surface.
  # Bound to an explicit address, never wildcard :53 -- a wildcard collides
  # with the host's systemd-resolved stub listener.
  #
  # These three are built here rather than pulled, so unlike sing-box and ikev2
  # there is no version in an `image:` line to pin -- the local tag is rewritten
  # by every `--build`. What they are pinned TO lives in each Dockerfile as an
  # ARG with a default (dnstt-server's version, microsocks' tag and commit, the
  # base-image digests), and each image carries the same values as
  # org.opencontainers.image labels, so `docker inspect dnstt-server:latest`
  # answers "what is running" on a box whose checkout has since moved.
  # Deliberately not restated here: scripts/check.sh reads sing-box's tag out of
  # this file precisely so that one version is not written in two places, and
  # copying these up would recreate the drift that rule exists to prevent.
  dnstt:
    build: ./dnstt
    image: dnstt-server:latest
    container_name: dnstt-server
    logging: *logging
    restart: always
    network_mode: host
    profiles: ["dnstt"]
    # One capability, because it does exactly one privileged thing: bind udp/53
    # in the host's network namespace. Verified on the built image -- CapEff is
    # 0x400 and nothing else, and the listener comes up. It stays uid 0 rather
    # than taking a non-root user, because a non-root uid would need
    # NET_BIND_SERVICE as a file capability on the binary, which is more moving
    # parts than an empty capability set around a process that opens one socket
    # and reads one key.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    # It reads a key and writes nothing -- verified read-only end to end, with
    # the key already mounted :ro below. If it ever does need a scratch path,
    # the answer is a tmpfs for that path, not dropping this line: the whole
    # point is that a public-facing parser on udp/53 cannot leave anything
    # behind in its own filesystem.
    read_only: true
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ${VPN_STATE:-/etc/vpn-stack}/rendered/dnstt:/keys:ro
    # The zone is the operator's own -- deployment config in .env, not a
    # literal in git, or every clone of this repo would serve the author's
    # zone. Interpolated plainly and NOT as ${VPN_DNSTT_ZONE:?...}: measured on
    # v5.3.1, `:?` on an unset variable fails project load, so `config`, `ps`
    # and even `up sing-box` all die while dnstt is merely switched off -- the
    # same trap that put `required: false` on ikev2.env above. The loud failure
    # lives in vpnctl/protocols/dnstt.py. Unset, `protocol on dnstt` refuses
    # outright; an already-enabled dnstt renders with a warning and this
    # argument simply vanishes, which dnstt-server rejects as a usage error.
    command: >-
      -udp ${VPN_SERVER_HOST}:53
      -privkey-file /keys/server.key
      ${VPN_DNSTT_ZONE} 127.0.0.1:2222

  # The SSH front the mobile clients log into. In a container, not on the host:
  # iOS apps speak DNSTT -> SSH and need a login, and putting that login on the
  # host would mean a real account plus an edit to the host's sshd_config, both
  # outside anything `vpn backup` captures. Here it is a disposable Alpine with
  # nothing mounted, and the credentials are rendered from the keyring.
  dnstt-sshd:
    build: ./dnstt-sshd
    image: dnstt-sshd:latest
    container_name: dnstt-sshd
    logging: *logging
    restart: always
    network_mode: host
    profiles: ["dnstt"]
    env_file:
      - path: ${VPN_STATE:-/etc/vpn-stack}/rendered/dnstt.env
        required: false
    volumes:
      - dnstt-sshd-keys:/host-keys
      # The rendered `name:password` list. A directory, not a single file:
      # docker silently creates a *directory* in place of a missing bind-mount
      # source, which would fail far from the cause.
      - ${VPN_STATE:-/etc/vpn-stack}/rendered/dnstt-sshd:/conf:ro
    # The one failure in this stack that nothing else can observe. This sshd
    # binds 127.0.0.1:2222, so it contributes no port to composectl's readiness
    # wait and none to scripts/smoke.sh -- both look only at non-loopback
    # addresses, deliberately, because substring-matching 53 reports
    # systemd-resolved's stub as dnstt. Meanwhile dnstt-server goes on answering
    # udp/53, so a client completes the whole tunnel and meets a closed door
    # while `apply` reports success on every port it knows about.
    #
    # It reports; it does not act. An unhealthy container is not restarted by
    # compose -- `restart: always` reacts to the process exiting, not to health
    # -- which is what makes this safe to add to a service people are using: a
    # false negative prints "unhealthy" in `docker compose ps`, which is exactly
    # where composectl.not_running is already looking, and does nothing else.
    #
    # `nc` is busybox's own applet, with -z and -w: no package to install and
    # nothing extra to pin. The port comes from the same SSH_PORT the entrypoint
    # reads out of the rendered dnstt.env, not from a second literal here --
    # two literals drift, and this stack has been bitten by that shape before.
    # `$$` so compose leaves the expansion to the container's shell.
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 127.0.0.1 \"$${SSH_PORT:-2222}\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # SOCKS5 exit for SSH-over-dnstt clients. Loopback only: reachable solely
  # through an authenticated SSH forward, never from outside.
  dnstt-socks:
    build: ./dnstt-socks
    image: dnstt-socks:latest
    container_name: dnstt-socks
    logging: *logging
    restart: always
    network_mode: host
    profiles: ["dnstt"]
    # Needs nothing at all: one high loopback port in, outbound sockets out.
    # The uid is the one dnstt-socks/Dockerfile creates -- numeric here on
    # purpose, because a numeric `user:` cannot fail an /etc/passwd lookup at
    # container-create time. Keep the two in step.
    #
    # Verified on the built image: uid 10300, CapEff 0x0, read-only rootfs, and
    # 127.0.0.1:7300 bound. Every byte a dnstt client sends leaves the box
    # through this process, and it needs no privilege whatsoever to do that --
    # the cheapest place in the stack to strip one, so it is stripped to nothing.
    user: "10300:10300"
    cap_drop: [ALL]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    command: -i 127.0.0.1 -p 7300
    # Same reasoning as dnstt-sshd's: loopback-only, so no port check anywhere
    # else can see it, and reporting only -- an unhealthy container is not
    # restarted by compose. A bare connect-and-close, measured to produce no log
    # line from microsocks, so this does not spend the 10m log budget above.
    healthcheck:
      test: ["CMD", "nc", "-z", "-w", "2", "127.0.0.1", "7300"]
      interval: 60s
      timeout: 5s
      start_period: 10s
      retries: 3
