volumes:
  ikev2-vpn-data:

services:
  ikev2:
    image: hwdsl2/ipsec-vpn-server
    container_name: ipsec-vpn-server
    restart: always
    network_mode: host
    privileged: true
    env_file:
      - ./ikev2/.env
    volumes:
      - ikev2-vpn-data:/etc/ipsec.d
      - /lib/modules:/lib/modules:ro

  sing-box:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: sing-box
    restart: always
    network_mode: host
    volumes:
      - ./sing-box:/etc/sing-box:ro
      - ./data:/var/lib/sing-box
    command: >-
      -D /var/lib/sing-box
      -C /etc/sing-box/common
      -C /etc/sing-box/vless-reality
      -C /etc/sing-box/hysteria2
      run

  device-limiter:
    image: python:3.12-slim
    container_name: vpn-device-limiter
    restart: always
    network_mode: host
    depends_on:
      - sing-box
    volumes:
      - ./device-limiter/limiter.py:/app/limiter.py:ro
      # read-write (not :ro): the daemon self-truncates sing-box.log once it
      # grows past LOG_MAX_BYTES, since sing-box's `log.output` has no rotation.
      - ./data:/var/lib/sing-box
    working_dir: /app
    command: ["python3", "-u", "limiter.py"]
    environment:
      CLASH_API_URL: "http://127.0.0.1:9090"
      CLASH_API_SECRET: "${CLASH_API_SECRET}"
      POLL_INTERVAL_SECONDS: "5"
      LOG_FILE_PATH: "/var/lib/sing-box/sing-box.log"
      LOG_MAX_BYTES: "10485760"
