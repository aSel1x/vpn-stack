volumes:
  ikev2-vpn-data:

services:
  ikev2:
    image: hwdsl2/ipsec-vpn-server
    container_name: ipsec-vpn-server
    restart: always
    network_mode: host
    # Not privileged: true. network_mode: host means there's no separate
    # container netns, so Compose can't set the sysctls this image normally
    # wants (Docker rejects `sysctls:` under host networking) -- those are
    # applied once on the host itself instead, see scripts/host-bootstrap.sh.
    #
    # Confirmed via a live diagnostic (privileged: true, then a full
    # bare-metal hwdsl2/setup-ipsec-vpn install replacing this container
    # entirely): capability mode and Docker-vs-bare-metal are both ruled
    # out as factors in a client-side IKEv2 connectivity issue -- packets
    # never arrived at this host's interface in any of the three
    # configurations. Root cause is a network path issue upstream of this
    # server, not this container's privilege level.
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/ppp:/dev/ppp"
    env_file:
      - ./ikev2/.env
    volumes:
      - ikev2-vpn-data:/etc/ipsec.d
      - /lib/modules:/lib/modules:ro

  sing-box:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: sing-box
    restart: always
    network_mode: host
    volumes:
      - ./sing-box:/etc/sing-box:ro
      - ./data:/var/lib/sing-box
    command: >-
      -D /var/lib/sing-box
      -C /etc/sing-box/common
      -C /etc/sing-box/vless-reality
      -C /etc/sing-box/hysteria2
      run

  # DNS tunnel (dnstt): last-resort bypass for networks that allow only DNS
  # egress. Delegated zone tun.example.net (NS ns-tun.example.net -> this host)
  # answers on udp/53; the tunneled stream is handed to the host sshd, and
  # clients ride SSH on top, exiting via dnstt-socks. keys/server.key is
  # gitignored and lives only on the server.
  dnstt:
    build: ./dnstt
    image: dnstt-server:latest
    container_name: dnstt-server
    restart: always
    network_mode: host
    volumes:
      - ./dnstt/keys:/keys:ro
    command: >-
      -udp ${VPN_SERVER_HOST}:53
      -privkey-file /keys/server.key
      tun.example.net 127.0.0.1:22

  # SOCKS5 exit for the dnstt SSH clients. Loopback-only: reachable solely
  # through an authenticated pentest-dnstt SSH forward, never from outside.
  dnstt-socks:
    build: ./dnstt-socks
    image: dnstt-socks:latest
    container_name: dnstt-socks
    restart: always
    network_mode: host
    command: -i 127.0.0.1 -p 7300
