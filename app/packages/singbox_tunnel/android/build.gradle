// No `buildscript { classpath 'com.android.tools.build:gradle:...' }` block here,
// deliberately, and that is a departure from the `flutter create --template=plugin`
// output.
//
// The app's android/ directory is not committed -- app/README.md: it is
// scaffolding, regenerated by `flutter create` in CI -- so the AGP and Kotlin
// versions this plugin would have to name are whatever that template pins on the
// day CI runs. Naming a different one loads AGP twice into one build, which fails
// with "The Android Gradle plugin was loaded multiple times" and is unfixable from
// here. Omitting the block makes this module inherit the app's plugin classpath,
// which is the version that is actually going to compile it.
//
// If `apply plugin: "com.android.library"` ever fails with "plugin not found", the
// app's settings.gradle has stopped declaring AGP with `apply false`, and the fix
// is to restore the buildscript block with the versions that settings.gradle names
// -- not to guess.

group = "io.github.asel1x.singbox_tunnel"
version = "0.1.0"

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

repositories {
    google()
    mavenCentral()
}

android {
    namespace = "io.github.asel1x.singbox_tunnel"

    // 34, not the newest: AndroidManifest.xml uses
    // android:foregroundServiceType="systemExempted", an enum value aapt2 only
    // knows from API 34, and a library compiled against a HIGHER API than the app
    // it is linked into is an AGP error while a lower one is not. 34 is the floor
    // that compiles and the ceiling that cannot collide.
    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // NOT `kotlinOptions {}`: that DSL was deprecated in Kotlin 2.0 and REMOVED in
    // 2.2, and Flutter 3.47.4 pins the Kotlin Gradle plugin at 2.4.0, so it fails
    // configuration with `Could not find method kotlinOptions()`. Flutter's own
    // plugin template uses this form.
    kotlin {
        compilerOptions {
            // Matches .github/workflows/app.yml, which installs temurin 17 for
            // the Android job. A jvmTarget above the JDK Gradle runs on does not
            // compile.
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        // libbox.aar is built with `-androidapi 24` (sing-box v1.14.0
        // cmd/internal/build_libbox/main.go:127, the `libbox.aar` variant). A
        // lower minSdk here merges into an APK whose native library will not
        // load on the devices it claims to support.
        minSdk = 24
    }
}

// sing-box publishes no .aar anywhere -- the v1.14.0 release carries 167 assets
// and not one of them is this -- so it is built from source by the `libbox` job in
// .github/workflows/app.yml and has to be dropped in here.
//
// The check is a hard failure rather than a warning on purpose. Without the
// library this module still compiles its Dart side, registers its channels and
// produces an APK; that APK would then fail at the first connect with a
// ClassNotFoundException from inside a Go callback, which is the least legible
// possible place to learn that a build step was skipped.
def libbox = file("libs/libbox.aar")
if (!libbox.exists()) {
    throw new GradleException(
        "singbox_tunnel: missing android/libs/libbox.aar.\n" +
        "\n" +
        "It is not published; it is built from sing-box's own source. The `libbox`\n" +
        "job in .github/workflows/app.yml already builds it (it reads the version out\n" +
        "of compose.yml, clones that tag, and runs `make lib_install && make\n" +
        "lib_android`) and uploads it as the `libbox-<version>` artifact -- but no job\n" +
        "downloads it into this directory yet. Wire that up, or build it locally with\n" +
        "a Go 1.25.5 toolchain and an Android NDK and copy libbox.aar to:\n" +
        "  " + libbox.absolutePath
    )
}

repositories {
    // AGP refuses `implementation files('x.aar')` in a LIBRARY module outright:
    // "Direct local .aar file dependencies are not supported when building an
    // AAR", because the classes and the packaged libgojni.so would not make it
    // into the resulting AAR. sing-box-for-android does exactly that and gets
    // away with it only because its module is an application, not a library --
    // and a Flutter plugin is a library by construction. A flatDir repository is
    // the supported shape for the same file.
    flatDir {
        dirs "libs"
    }
}

dependencies {
    // Named through the flatDir repository above, not `files()`. `implementation`
    // and not `api`: nothing outside this module should be naming
    // io.nekohasekai.libbox types.
    implementation(name: "libbox", ext: "aar")
}
