name: vpn_stack_app
description: Provision a server and connect to it. Client for the vpn-stack CLI.
publish_to: none
version: 0.1.0

environment:
  # Flutter 3.47.4 stable ships Dart 3.13.3; taken from the release manifest,
  # not guessed. Raise this deliberately, not because a lockfile drifted.
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # Pure Dart SSH, so provision/ and control/ run unchanged on every target
  # and need no platform channel. `lib/transport/` is the only thing that
  # imports it.
  #
  # Pinned exactly, and alone among these in being pinned. The security of this
  # app rests on one parameter of one function -- `SSHClient.onVerifyHostKey`,
  # which 4.1.0 calls from `SSHTransport._handleMessageKexReply` before it sends
  # NEWKEYS and therefore before any credential -- and that was established by
  # reading 4.1.0's source, not its documentation. pubspec.lock is not committed
  # here, so an unpinned line means the version that ships is whatever pub.dev
  # holds on the day CI runs, which is not the version anybody checked. 4.0.0
  # was three days after 3.3.1 and moved `SSHClient.close()`'s return type and
  # dropped three algorithm families, so the blast radius of a drift is not
  # theoretical. Bumping it is a deliberate one-line commit whose review is
  # re-reading that call site.
  dartssh2: 4.1.0
  # SSH credentials and VPN credentials never go in plain preferences.
  flutter_secure_storage:
  provider:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:

# The rest are deliberately unpinned at this stage and resolved by CI, which is
# the only place this builds. A pinned version written by somebody who could not
# run `flutter pub get` is a guess wearing a number; pubspec.lock from the first
# green CI run is the honest place to freeze them. dartssh2 is the one exception
# and the comment above says why: 4.1.0 is not a guess, it is the version whose
# source was read to establish that no credential is sent before the host key is
# checked, and that claim does not transfer to a version nobody has looked at.

flutter:
  uses-material-design: true
