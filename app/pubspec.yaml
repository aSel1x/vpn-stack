name: vpn_stack_app
description: Provision a server and connect to it. Client for the vpn-stack CLI.
publish_to: none
version: 0.1.0

environment:
  # Flutter 3.47.4 stable ships Dart 3.13.3; taken from the release manifest,
  # not guessed. Raise this deliberately, not because a lockfile drifted.
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # Pure Dart SSH, so provision/ and control/ run unchanged on every target
  # and need no platform channel. `lib/transport/` is the only thing that
  # imports it.
  #
  # Pinned exactly, and alone among these in being pinned. The security of this
  # app rests on one parameter of one function -- `SSHClient.onVerifyHostKey`,
  # which 4.1.0 calls from `SSHTransport._handleMessageKexReply` before it sends
  # NEWKEYS and therefore before any credential -- and that was established by
  # reading 4.1.0's source, not its documentation. That clause used to continue
  # "pubspec.lock is not committed here", which stopped being true the day the
  # lock landed a few lines below; the pin stays anyway, because a lock is
  # rewritten by anybody's `pub upgrade` and read by nobody, so the version
  # somebody actually checked belongs where the next person editing this file
  # will see it. 4.0.0 was three days after 3.3.1 and moved `SSHClient.close()`'s
  # return type and dropped three algorithm families, so the blast radius of a
  # drift is not theoretical. Bumping it is a deliberate one-line commit whose
  # review is re-reading that call site.
  dartssh2: 4.1.0
  # SSH credentials and VPN credentials never go in plain preferences.
  flutter_secure_storage:
  provider:
  # The Android tunnel: a VpnService that hands its TUN file descriptor to
  # libbox, behind lib/tunnel/'s TunnelController.
  #
  # A path dependency, and it has to be one. The Kotlin cannot live in
  # app/android/ -- that directory is generated by `flutter create` in CI and
  # gitignored, so anything hand-added there is deleted on the next run -- and
  # the package cannot depend back on this app either, because
  # app -> singbox_tunnel -> app is a cycle pub refuses. A committed package
  # under packages/ is the seam that survives both.
  #
  # Its own pubspec declares `platforms: android:` and nothing else, so the
  # iOS, macOS, Windows and Linux builds resolve it and link nothing. That is
  # not a placeholder for the others: an empty stub would register a channel
  # that answers nothing, which is worse than a platform saying it is
  # unimplemented.
  #
  # Adding this line changes pubspec.lock -- a path package gets an entry of
  # its own. Do not hand-write it: take the lock from the `pubspec.lock`
  # artifact of the run that resolved it, for the reason the block below gives.
  singbox_tunnel:
    path: packages/singbox_tunnel

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:

# The rest carry no constraint here and are frozen by pubspec.lock, which IS
# committed. That was the plan -- freeze from the first green run -- and then the
# gap between plan and practice cost a red build on a tree nobody had touched:
# objective_c 9.6.1, pulled in transitively by flutter_secure_storage and
# published between two runs, has a build hook calling `Architecture.arm64e`,
# which the Dart SDK in Flutter 3.47.4 does not define. No constraint written
# here could have avoided it -- objective_c declares `sdk: >=3.10.0 <4.0.0`, so
# pub is right to pick it and the package is wrong about what it needs. Only a
# lock helps, and the one in the tree is the last green run's own artifact
# rather than something generated on a machine with no Dart toolchain.
#
# dartssh2 is pinned in the file as well as in the lock, and the comment above
# says why: 4.1.0 is the version whose source was read to establish that no
# credential is sent before the host key is checked. That claim does not
# transfer to a version nobody has looked at, so it belongs where a human
# editing dependencies will see it.

flutter:
  uses-material-design: true
