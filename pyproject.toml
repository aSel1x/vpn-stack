[project]
name = "vpnctl"
version = "0.1.0"
description = "CLI to manage sing-box VPN users (VLESS+REALITY, Hysteria2)"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "qrcode>=7.4",
    "pillow>=10",
]

[project.scripts]
vpnctl = "vpnctl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vpnctl"]
